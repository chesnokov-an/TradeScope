<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6f97"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <g font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
    <rect x="20" y="60" width="230" height="140" rx="10"
          fill="#f7fafc" stroke="#b8c9dc" stroke-width="1.6"/>
    <text x="135" y="95" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3557">Браузер</text>
    <text x="135" y="130" text-anchor="middle" font-size="13" fill="#3e4c59">web/: HTML, CSS, JS</text>
    <text x="135" y="155" text-anchor="middle" font-size="13" fill="#3e4c59">5 графиков на Canvas</text>

    <rect x="340" y="60" width="300" height="140" rx="10"
          fill="#f7fafc" stroke="#b8c9dc" stroke-width="1.6"/>
    <text x="490" y="95" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3557">cmd/server</text>
    <text x="490" y="130" text-anchor="middle" font-size="13" fill="#3e4c59">net/http</text>
    <text x="490" y="155" text-anchor="middle" font-size="13" fill="#3e4c59">статика + POST /api/backtest</text>

    <rect x="730" y="60" width="230" height="140" rx="10"
          fill="#f7fafc" stroke="#b8c9dc" stroke-width="1.6"/>
    <text x="845" y="95" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3557">internal/tradescope</text>
    <text x="845" y="130" text-anchor="middle" font-size="13" fill="#3e4c59">CSV → сигналы → сделки</text>
    <text x="845" y="155" text-anchor="middle" font-size="13" fill="#3e4c59">бэктест и метрики</text>

    <line x1="250" y1="110" x2="334" y2="110" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="160" x2="256" y2="160" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="292" y="100" text-anchor="middle" font-size="11" fill="#52606d">HTTP</text>
    <text x="292" y="180" text-anchor="middle" font-size="11" fill="#52606d">JSON</text>

    <line x1="640" y1="110" x2="724" y2="110" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="730" y1="160" x2="646" y2="160" stroke="#2a6f97" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="685" y="100" text-anchor="middle" font-size="11" fill="#52606d">вызов</text>
    <text x="685" y="180" text-anchor="middle" font-size="11" fill="#52606d">итог</text>

    <text x="490" y="230" text-anchor="middle" font-size="12" fill="#7b8794">Один Go-процесс, без внешних зависимостей и CDN</text>
  </g>
